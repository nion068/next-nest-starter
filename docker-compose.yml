services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app?schema=public
      SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3001:3001"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env
    environment: { API_INTERNAL_URL: http://api:3001, NEXT_PUBLIC_API_URL: http://localhost:3001 }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres_data:
